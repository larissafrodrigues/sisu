    <title>Bússola SISU</title>
    <script>
      // Aplica o tema antes da primeira pintura (ver src/tema/tema.ts).
      (function () {
        var p = null;
        try { p = localStorage.getItem("bussola-sisu:tema"); } catch (e) {}
        var escuro = p === "escuro" || (p !== "claro" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.tema = escuro ? "escuro" : "claro";
      })();
    </script>
